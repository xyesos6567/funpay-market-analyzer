name: Анализ рынка FunPay

# Кнопка "Run workflow" в интерфейсе GitHub и кнопка на самой странице отчёта —
# это один и тот же запуск. Дополнительно отчёт пересобирается по расписанию.
on:
  workflow_dispatch:
    inputs:
      max_categories:
        description: "Сколько категорий добавлять автопоиском (0 — только основные)"
        required: false
        default: "8"
  schedule:
    # 06:00 UTC = 09:00 по Москве. GitHub может задержать запуск на несколько минут.
    - cron: "0 6 * * *"

# Нужно право записи, чтобы обновить ветку gh-pages с готовой страницей.
permissions:
  contents: write

# Не запускать два прогона одновременно: второй пишет поверх первого.
concurrency:
  group: funpay-report
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Получить код
        uses: actions/checkout@v7

      - name: Установить Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Установить зависимости
        run: python -m pip install -r requirements.txt

      # Тесты идут до сбора данных: если FunPay поменяет разметку или валюту,
      # сбор упадёт здесь, а не выдаст тихо неверные рекомендации.
      - name: Тесты парсера и аналитики
        run: python -m pytest

      - name: Собрать свежие данные
        env:
          FPA_MAX_CATEGORIES: ${{ inputs.max_categories || '8' }}
          FPA_CACHE_TTL_MINUTES: "0"   # в облаке кэш не нужен, данные должны быть свежими
          FPA_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: python -m analyzer run

      - name: Подготовить страницу
        run: |
          mkdir -p public
          cp out/report.html public/index.html
          cp out/data.json public/data.json
          # Без этого файла GitHub попытается обработать страницу через Jekyll.
          touch public/.nojekyll

      # Публикация через ветку, а не через артефакты Pages: артефактный способ
      # в этом репозитории стабильно падал на шаге deploy-pages с ошибкой
      # "No artifacts named github-pages were found", хотя артефакт создавался.
      - name: Опубликовать на gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd public
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Отчёт от $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:gh-pages
